name: Payment checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      executor-postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: executor
          POSTGRES_PASSWORD: executor
          POSTGRES_DB: executor_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U executor -d executor_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
      kafka:
        image: apache/kafka:4.1.2
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 19092:19092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:19092 >/dev/null 2>&1"
          --health-interval 5s --health-timeout 10s --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment -d payment_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      EXECUTOR_DATABASE_URL: postgresql+asyncpg://executor:executor@127.0.0.1:5433/executor_db
      TEST_EXECUTOR_DATABASE_URL: postgresql+asyncpg://executor:executor@127.0.0.1:5433/postgres
      PAYMENT_DATABASE_URL: postgresql+asyncpg://payment:payment@127.0.0.1:5432/payment_db
      TEST_DATABASE_URL: postgresql+asyncpg://payment:payment@127.0.0.1:5432/postgres
      TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:19092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install --no-deps -e services/executor
      - run: python -m pip install --no-deps -e libs/contracts
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: mypy --config-file libs/contracts/pyproject.toml libs/contracts/contracts
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic -c executor-alembic.ini upgrade head
      - run: alembic -c executor-alembic.ini check
      - name: Create Kafka topics
        id: ready
        run: |
          for topic in attempt.commands attempt.events; do
            docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:19092 --create --if-not-exists --topic "$topic" --partitions 3 --replication-factor 1
          done
      - name: 01 - Message contracts
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: python scripts/run_test_group.py contracts
      - name: 02 - Payment API and idempotency
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: python scripts/run_test_group.py payment
      - name: 03 - Executor and execution leases
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: python scripts/run_test_group.py execution
      - name: 04 - Kafka delivery and recovery
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: python scripts/run_test_group.py delivery
      - name: 05 - Reconciliation and signed callbacks
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: python scripts/run_test_group.py reconciliation
      - name: 06 - Channels and end-to-end flows
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        run: python scripts/run_test_group.py channels
      - name: QA acceptance summary
        if: always()
        run: python scripts/qa_summary.py
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results-${{ github.sha }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
