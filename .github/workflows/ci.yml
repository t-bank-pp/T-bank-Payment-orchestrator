name: Payment checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  payment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payment
          POSTGRES_PASSWORD: payment
          POSTGRES_DB: payment_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payment -d payment_db"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PAYMENT_DATABASE_URL: postgresql+asyncpg://payment:payment@127.0.0.1:5432/payment_db
      TEST_DATABASE_URL: postgresql+asyncpg://payment:payment@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip install --no-deps -e libs/contracts
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: mypy --config-file libs/contracts/pyproject.toml libs/contracts/contracts
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
