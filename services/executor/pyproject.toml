[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tbank-executor"
version = "0.1.0"
description = "Durable execution state for the synthetic payment orchestrator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "aiokafka>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
