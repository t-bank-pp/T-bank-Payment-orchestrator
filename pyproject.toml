[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tbank-payment"
version = "0.1.0"
description = "Payment-service foundation for a synthetic payment orchestrator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["services/payment/src"]

[tool.pytest.ini_options]
testpaths = ["services/payment/tests", "libs/contracts/tests"]
asyncio_mode = "auto"
markers = ["integration: requires TEST_DATABASE_URL and PostgreSQL 16"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
files = ["services/payment/src"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
